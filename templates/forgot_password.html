{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">{{ translations.reset_password_title }}</h2>
            </div>
            <div class="card-body">
                <p class="text-secondary">{{ translations.reset_password_instruction }}</p>
                <form action="{{ url_for('forgot_password') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">{{ translations.username }}</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ translations.email }}</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">{{ translations.new_password }}</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">{{ translations.confirm_password }}</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">{{ translations.reset_password_button }}</button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <p><a href="{{ url_for('login') }}">{{ translations.back_to_login }}</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const password = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');

        form.addEventListener('submit', function(e) {
            if (password.value !== confirmPassword.value) {
                e.preventDefault();
                alert('Passwords do not match!');
            }
        });
    });
</script>
{% endblock %}
