[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask-login>=0.6.3",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "pillow>=11.3.0",
    "werkzeug>=3.1.3",
    "sqlalchemy>=2.0.40",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

# psycopg2-binary is only needed for Postgres (Render deploy). Local dev uses
# SQLite by default, and psycopg2-binary has no prebuilt wheel for very new
# Python versions yet, forcing a source build that needs pg_config. Install
# with `uv sync --extra postgres` when you actually need Postgres locally.
[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.10"]
